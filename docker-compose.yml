services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
      - ./models:/srv/models
      - ./ml/mlruns:/srv/ml/mlruns
    environment:
      - FORECAST_LAB_API_CORS_ALLOW_ORIGINS=["http://localhost:5173"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
