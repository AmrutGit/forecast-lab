name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check ml backend

      - name: Run ML pipeline unit tests
        run: pytest ml/tests -v

      - name: Generate synthetic data fixture for backend tests
        run: python -m ml.data_generator.generate

      - name: Train a model so backend serving tests have a registered version
        run: python -m ml.pipeline.run_training
        env:
          FORECAST_LAB_CONFIG: ml/config/config.ci.yaml

      - name: Run backend API tests
        run: pytest backend/tests -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
